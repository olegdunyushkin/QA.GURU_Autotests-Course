plugins {
    id 'java-library'
    id 'io.qameta.allure' version '4.0.2'
}

def allureAdapterVersion = '2.35.2'
def allureReportVersion = '2.42.0'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'com.codeborne:selenide:7.14.0'
    testImplementation 'net.datafaker:datafaker:2.5.4'
    testImplementation "io.qameta.allure:allure-junit5:$allureAdapterVersion"
    testImplementation "io.qameta.allure:allure-selenide:$allureAdapterVersion"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.2'
    testImplementation 'org.slf4j:slf4j-simple:2.0.9'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

allure {
    version.set(allureReportVersion)
    adapter {
        allureJavaVersion.set(allureAdapterVersion)
        aspectjWeaver.set(true)
        frameworks {
            junit5 {
                adapterVersion.set(allureAdapterVersion)
            }
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    systemProperties(System.getProperties())
    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard_error", "standard_out"
            exceptionFormat "short"
        }
    }
}
